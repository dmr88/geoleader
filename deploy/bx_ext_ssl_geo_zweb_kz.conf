server {
    listen 443 ssl http2;
    server_name geo.zweb.kz;

    ssl_certificate     /etc/letsencrypt/live/geo.zweb.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo.zweb.kz/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/geo.zweb.kz_ssl_access.log main;
    error_log  /var/log/nginx/geo.zweb.kz_ssl_error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        client_max_body_size 30M;
        proxy_read_timeout 120s;
    }
}
