# Additional website (Docker) — geo.zweb.kz
server {
    listen 80;
    server_name geo.zweb.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    access_log /var/log/nginx/geo.zweb.kz_access.log main;
    error_log  /var/log/nginx/geo.zweb.kz_error.log warn;

    server_name_in_redirect off;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        client_max_body_size 30M;
        proxy_read_timeout 120s;
    }

    # ЗАКОММЕНТИРОВАНО намеренно, чтобы Битрикс не перехватывал запросы:
    # include bx/conf/bitrix.conf;
    # include bx/server_monitor.conf;
}
